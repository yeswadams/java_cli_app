name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java-version: [ '17', '21' ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Execute Test Suite with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Archive Test Results (Surefire Reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}-java${{ matrix.java-version }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build Executable JAR Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Package Standalone Fat JAR
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload Shaded JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: transaction-analyzer-jar
          path: target/transaction-analyzer.jar
          retention-days: 14
